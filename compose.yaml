name: vermietungsverwaltung
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: vermietung
      POSTGRES_USER: vermietung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vermietung", "-d", "vermietung"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
